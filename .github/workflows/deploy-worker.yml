name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-worker.yml"

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Test Worker
        run: node worker.test.mjs

      - name: Upload PLAYLIST_URL secret to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: |
          if [ -z "$PLAYLIST_URL" ]; then
            echo "PLAYLIST_URL GitHub secret is empty or missing."
            exit 1
          fi
          printf '%s' "$PLAYLIST_URL" | npx wrangler secret put PLAYLIST_URL

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
