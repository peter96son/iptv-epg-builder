name: Backfill Movie Metadata

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Maximum TMDb HTTP requests for this run"
        required: true
        default: "2500"
      dry_run:
        description: "Only measure queue; do not call TMDb"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: epg-metadata
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore EPG and metadata cache
        id: epg-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: epg-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            epg-cache-${{ runner.os }}-

      - name: Restore durable metadata snapshot
        run: python -m src.metadata_snapshot restore

      - name: Run tests
        run: python -m pytest -q

      - name: Backfill from committed EPG
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BACKFILL_HTTP_BUDGET: ${{ inputs.budget }}
          METADATA_DEADLINE_SECONDS: "2100"
          METADATA_TIMEOUT: "8"
          METADATA_CHECKPOINT_EVERY: "25"
          TMDB_EMPTY_PLAN_LIMIT: "4"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.metadata_backfill --budget "${{ inputs.budget }}" --dry-run
          else
            python -m src.metadata_backfill --budget "${{ inputs.budget }}"
          fi

      - name: Save durable metadata snapshot
        if: ${{ inputs.dry_run == false }}
        run: python -m src.metadata_snapshot save

      - name: Save EPG and metadata cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: epg-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Commit backfill database and report
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metadata.sqlite3.gz output/metadata-backfill.json
          if git diff --cached --quiet; then
            echo "No metadata backfill changes"
          else
            git commit -m "Backfill metadata"
            git push
          fi
