name: Backfill Movie Metadata

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Maximum TMDb HTTP requests; smart mode may use less"
        required: true
        default: "5000"
      dry_run:
        description: "Only measure queue; do not call TMDb"
        required: true
        default: false
        type: boolean

  # Nightly smart maintenance. GitHub cron is UTC.
  # 11:20 UTC = 04:20 PDT / 03:20 PST.
  schedule:
    - cron: "20 11 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: epg-metadata
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore EPG and metadata cache
        id: epg-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: epg-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            epg-cache-${{ runner.os }}-

      - name: Restore durable metadata snapshot
        run: python -m src.metadata_snapshot restore

      - name: Run tests
        run: python -m pytest -q

      - name: Smart backfill from committed EPG
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BACKFILL_HTTP_BUDGET: ${{ inputs.budget || '5000' }}
          METADATA_DEADLINE_SECONDS: "2100"
          METADATA_TIMEOUT: "8"
          METADATA_CHECKPOINT_EVERY: "25"
          TMDB_EMPTY_PLAN_LIMIT: "4"
        run: |
          BUDGET="${{ inputs.budget || '5000' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.metadata_backfill --budget "$BUDGET" --dry-run
          else
            python -m src.metadata_backfill --budget "$BUDGET"
          fi

      - name: Show smart backfill summary
        if: always()
        shell: bash
        run: |
          if [ -f output/metadata-backfill.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("output/metadata-backfill.json")
          r = json.loads(p.read_text())
          before = r.get("database_before", {})
          after = r.get("database_after", {})
          growth = r.get("database_growth", {})
          print("=== SMART METADATA BACKFILL ===")
          print("Effective HTTP budget:", r.get("effective_budget"))
          print("HTTP spent:", r.get("http_spent"))
          print("Remaining queue:", r.get("remaining"))
          print("Movies:", after.get("movies"), f"({growth.get('movies', 0):+d})")
          print("Series:", after.get("series"), f"({growth.get('series', 0):+d})")
          print("Titles:", after.get("titles"), f"({growth.get('titles', 0):+d})")
          print("IMDb entities:", after.get("imdb_entities"), f"({growth.get('imdb_entities', 0):+d})")
          print("Complete metadata:", after.get("complete_metadata"), f"({growth.get('complete_metadata', 0):+d})")
          PY
          fi

      - name: Save durable metadata snapshot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: python -m src.metadata_snapshot save

      - name: Save EPG and metadata cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: epg-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Prune old EPG caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: epg-cache-${{ runner.os }}-
          KEEP_CACHES: "2"
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id,.key,.created_at] | @tsv' \
          | awk -F '\t' -v prefix="$CACHE_PREFIX" '$2 ~ "^" prefix {print}' \
          | sort -t $'\t' -k3,3r \
          | tail -n "+$((KEEP_CACHES + 1))" \
          | while IFS=$'\t' read -r cache_id cache_key created_at; do
              [ -n "${cache_id:-}" ] || continue
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
            done

      - name: Commit backfill database and reports
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/metadata.sqlite3.gz \
            output/metadata-backfill.json \
            output/metadata-growth-history.json

          if git diff --cached --quiet; then
            echo "No metadata backfill changes"
          else
            git commit -m "Smart metadata backfill"
            for attempt in 1 2 3 4; do
              echo "Publish attempt ${attempt}"
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Failed to publish metadata after 4 race-safe attempts"
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi
