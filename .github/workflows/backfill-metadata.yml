name: Backfill Movie Metadata

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Maximum TMDb HTTP requests"
        required: true
        default: "5000"
      dry_run:
        description: "Only measure queue; do not call TMDb"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "20 11 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: epg-metadata
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore EPG and metadata cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: epg-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            epg-cache-${{ runner.os }}-

      - name: Restore durable metadata snapshot
        run: python -m src.metadata_snapshot restore

      - name: Run tests
        run: python -m pytest -q

      - name: Smart clean backfill
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BACKFILL_HTTP_BUDGET: ${{ inputs.budget || '5000' }}
          METADATA_DEADLINE_SECONDS: "2100"
          METADATA_TIMEOUT: "8"
          METADATA_CHECKPOINT_EVERY: "25"
          TMDB_EMPTY_PLAN_LIMIT: "2"
        run: |
          BUDGET="${{ inputs.budget || '5000' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.metadata_backfill_v1325 --budget "$BUDGET" --dry-run
          else
            python -m src.metadata_backfill_v1325 --budget "$BUDGET"
          fi

      - name: Save durable metadata snapshot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: python -m src.metadata_snapshot save

      - name: Save EPG and metadata cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: epg-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Commit and publish backfill
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/metadata.sqlite3.gz \
            output/metadata-backfill.json \
            output/metadata-growth-history.json

          if git diff --cached --quiet; then
            echo "No metadata backfill changes"
            exit 0
          fi

          git commit -m "Smart metadata backfill"

          # Metadata processing changes extra runtime files. They are useful in the
          # cache but must not prevent rebase/push of the durable snapshot.
          echo "Non-published runtime changes:"
          git status --short
          if [ -n "$(git status --porcelain)" ]; then
            git stash push --include-untracked -m "backfill-runtime-${GITHUB_RUN_ID}"
          fi

          for attempt in 1 2 3 4; do
            echo "Publish attempt ${attempt}"
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              echo "Metadata backfill published successfully"
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Failed to publish metadata after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done
