name: Verify Missing Movie EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "55 * * * *"

permissions:
  contents: write

concurrency:
  group: epg-metadata
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ocr.txt

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-rus
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ocr.txt

      - name: Dispatcher — identify movie EPG gaps
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: python -m src.movie_epg_recovery audit

      - name: Observer — read current title from live stream
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
          STREAM_OCR_LANG: rus+eng
          GAP_PROBE_WORKERS: "8"
        run: python -m src.movie_epg_recovery observe

      - name: Evidence recorder — persist proven live titles
        run: python -m src.movie_epg_recovery record

      - name: Candidate finder — search all movie EPG sources
        env:
          EPG_DISCOVERY_TIMEOUT_CAP: "60"
        run: python -m src.movie_epg_recovery discover

      - name: Judge — select only evidence-matching EPG donors
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: python -m src.movie_epg_recovery select

      - name: Auditor — measure movie EPG after donor selection
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: python -m src.movie_epg_recovery audit

      - name: Publish evidence and proven donor results
        shell: bash
        run: |
          bash .github/scripts/safe-publish.sh "Recover movie EPG from live evidence"             data/live_epg_observations_v1518.csv             data/live_source_candidates_v1518.csv             data/source_evidence_state.json             output/movie-gap-live-probe.json             output/movie-gap-ocr-profiles.json             output/movie-epg-recovery.json             output/source-selection-v15.json             output/mapping.csv             output/epg.xml.gz             output/uhf-mapping.json             output/movie-epg-audit.csv             output/movie-epg-audit.json             output/movie-epg-gaps.csv
