name: Verify Missing Movie EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "55 * * * *"

permissions:
  contents: write

concurrency:
  group: movie-gap-live-probe
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-rus

      - name: Verify live streams for current movie EPG gaps
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
          STREAM_OCR_LANG: rus+eng
          GAP_PROBE_WORKERS: "4"
        run: python -m src.movie_gap_live_probe

      - name: Commit verification result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/movie-gap-live-probe.json
          if git diff --cached --quiet; then
            echo "No verification changes"
          else
            git commit -m "Verify missing movie EPG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
