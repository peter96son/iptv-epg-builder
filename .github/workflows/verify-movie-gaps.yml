name: Verify Missing Movie EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "55 * * * *"

permissions:
  contents: write

concurrency:
  group: epg-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ocr.txt

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-rus
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ocr.txt

      - name: Verify live streams for current movie EPG gaps
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
          STREAM_OCR_LANG: rus+eng
          GAP_PROBE_WORKERS: "4"
        run: python -m src.movie_gap_live_probe

      - name: Apply recognized titles to live EPG
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: |
          python -m src.live_ocr_epg_overlay
          python -m src.movie_epg_audit

      - name: Commit verification result
        shell: bash
        run: |
          .github/scripts/safe-publish.sh "Apply OCR movie titles to live EPG"             output/movie-gap-live-probe.json             output/movie-gap-ocr-profiles.json             output/live-ocr-epg-state.json             output/epg.xml.gz             output/uhf-mapping.json             output/movie-epg-audit.csv             output/movie-epg-audit.json             output/movie-epg-gaps.csv
