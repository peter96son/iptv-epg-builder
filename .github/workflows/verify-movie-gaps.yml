name: Verify Missing Movie EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "55 4 * * *"

permissions:
  contents: write

concurrency:
  group: movie-evidence
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Identify current movie EPG gaps
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: python -m src.movie_epg_recovery audit

      - name: Check missing movie channel coverage in online feeds
        env:
          EPG_ONLINE_DISCOVERY_TIMEOUT: "12"
          EPG_ONLINE_DISCOVERY_WORKERS: "10"
        run: python -m src.movie_online_source_discovery

      - name: Publish missing-channel coverage report
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          bash .github/scripts/safe-publish.sh "Report EPG coverage for movie channels missing provider schedules" \
            output/movie-online-source-discovery.json

      - name: Upload source discovery report for branch review
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: movie-online-source-discovery
          path: output/movie-online-source-discovery.json
          if-no-files-found: error
          retention-days: 7
