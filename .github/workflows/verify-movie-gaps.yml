name: Verify Missing Movie EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "55 4 * * *"

permissions:
  contents: write

concurrency:
  group: movie-evidence
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Identify current movie EPG gaps
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: python -m src.movie_epg_recovery audit

      - name: Search online EPG feeds by exact channel name
        env:
          EPG_ONLINE_DISCOVERY_TIMEOUT: "20"
          EPG_ONLINE_DISCOVERY_WORKERS: "6"
        run: python -m src.movie_online_source_discovery

      - name: Publish exact-name candidates and source comparison
        shell: bash
        run: |
          bash .github/scripts/safe-publish.sh "Compare online EPG sources for missing movie channels" \
            output/movie-online-source-discovery.json
