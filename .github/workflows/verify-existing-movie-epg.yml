name: Verify Existing Movie EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "25 */3 * * *"

permissions:
  contents: write

concurrency:
  group: epg-publish
  cancel-in-progress: false

jobs:
  verify-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ocr.txt

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-rus
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ocr.txt

      - name: Verify rotating sample of existing movie EPG
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
          STREAM_OCR_LANG: rus+eng
          LIVE_EPG_VERIFY_MAX: "250"
          LIVE_EPG_VERIFY_WORKERS: "12"
          LIVE_EPG_MISMATCH_CONFIRM: "2"
        run: python -m src.live_epg_verifier

      - name: Apply confirmed live mismatches to OCR state
        run: python -m src.live_ocr_epg_overlay

      - name: Commit verification evidence
        shell: bash
        run: |
          .github/scripts/safe-publish.sh "Verify existing movie EPG against live stream"             output/live-epg-verification.json             output/live-epg-verification-state.json             output/live-ocr-epg-state.json             output/epg.xml.gz             output/uhf-mapping.json
