name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: epg-metadata
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore EPG and metadata cache
        id: epg-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: epg-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            epg-cache-${{ runner.os }}-
      - name: Restore durable metadata snapshot
        run: python -m src.metadata_snapshot restore
      - name: Run tests
        run: python -m pytest -q
      - name: Build EPG
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
          EPG_TIMEZONE: America/Los_Angeles
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          METADATA_MAX_TITLES: "20000"
          METADATA_MAX_HTTP_REQUESTS: "0"
          BACKFILL_HTTP_BUDGET: "5000"
          METADATA_DEADLINE_SECONDS: "2100"
          METADATA_TIMEOUT: "8"
          METADATA_CHECKPOINT_EVERY: "25"
          TMDB_EMPTY_PLAN_LIMIT: "4"
          EPG_SOURCE_TIMEOUT_CAP: "90"
          EPG_SOURCE_RETRIES_CAP: "2"
          EPG_SOURCE_DEADLINE_SECONDS: "1500"
          EPG_MIN_FUTURE_HOURS: "6"
          XMLTV_SPILL_THRESHOLD_BYTES: "4194304"
        run: python run.py
      - name: Strict movie EPG QA
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: python -m src.movie_epg_audit
      - name: EPG horizon QA
        env:
          EPG_PUBLISH_MIN_FUTURE_HOURS: "6"
        run: python -m src.epg_horizon_audit
      - name: Live EPG binding and NOW NEXT audit
        run: python -m src.epg_live_audit
      - name: Save EPG and metadata cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: epg-cache-${{ runner.os }}-${{ github.run_id }}
      - name: Save durable metadata snapshot
        run: python -m src.metadata_snapshot save
      - name: Commit updated EPG output
        shell: bash
        run: |
          .github/scripts/safe-publish.sh "Update EPG"             output/epg.xml.gz             output/mapping.csv             output/uhf-mapping.json             output/movie-epg-audit.csv             output/movie-epg-audit.json             output/movie-epg-gaps.csv             output/source-selection-v15.json             output/status.json             data/metadata.sqlite3.gz
      - name: Audit live Cloudflare Worker delivery
        env:
          WORKER_PLAYLIST_URL: https://private-uhf-playlist.peter96son.workers.dev/tv
          WORKER_AUDIT_ATTEMPTS: "6"
          WORKER_AUDIT_DELAY: "8"
        run: python -m src.worker_audit
      - name: Commit Worker audit
        shell: bash
        run: |
          .github/scripts/safe-publish.sh "Audit Worker delivery"             output/worker-audit.json             output/worker-audit.csv             output/worker-audit-gaps.csv             output/status.json
