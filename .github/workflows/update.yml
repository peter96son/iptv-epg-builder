name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: epg-metadata
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore EPG and metadata cache
        id: epg-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: epg-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            epg-cache-${{ runner.os }}-

      - name: Restore durable metadata snapshot
        run: python -m src.metadata_snapshot restore

      - name: Run tests
        run: python -m pytest -q

      - name: Build EPG
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
          EPG_TIMEZONE: America/Los_Angeles
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          METADATA_MAX_TITLES: "20000"
          METADATA_MAX_HTTP_REQUESTS: "0"
          BACKFILL_HTTP_BUDGET: "5000"
          METADATA_DEADLINE_SECONDS: "2100"
          METADATA_TIMEOUT: "8"
          METADATA_CHECKPOINT_EVERY: "25"
          TMDB_EMPTY_PLAN_LIMIT: "4"
          EPG_SOURCE_TIMEOUT_CAP: "90"
          EPG_SOURCE_RETRIES_CAP: "2"
          EPG_SOURCE_DEADLINE_SECONDS: "1500"
          XMLTV_SPILL_THRESHOLD_BYTES: "4194304"
        run: python run.py

      - name: Save EPG and metadata cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: epg-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Prune old EPG caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: epg-cache-${{ runner.os }}-
          KEEP_CACHES: "2"
        shell: bash
        run: |
          set -euo pipefail
          echo "Keeping newest ${KEEP_CACHES} caches with prefix ${CACHE_PREFIX}"
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id,.key,.created_at] | @tsv' \
          | awk -F '\t' -v prefix="$CACHE_PREFIX" '$2 ~ "^" prefix {print}' \
          | sort -t $'\t' -k3,3r \
          | tail -n "+$((KEEP_CACHES + 1))" \
          | while IFS=$'\t' read -r cache_id cache_key created_at; do
              [ -n "${cache_id:-}" ] || continue
              echo "Deleting old cache ${cache_key} (${created_at})"
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
            done

      - name: Save durable metadata snapshot
        run: python -m src.metadata_snapshot save

      - name: Commit updated EPG output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/ data/metadata.sqlite3.gz
          if git diff --cached --quiet; then
            echo "No EPG output changes"
          else
            git commit -m "Update EPG"
            for attempt in 1 2 3 4; do
              echo "Publish attempt ${attempt}"
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Failed to publish EPG after 4 race-safe attempts"
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: Audit live Cloudflare Worker delivery
        env:
          WORKER_PLAYLIST_URL: https://iptv-epg.peter96son.workers.dev/tv
          WORKER_AUDIT_ATTEMPTS: "6"
          WORKER_AUDIT_DELAY: "8"
        run: python -m src.worker_audit

      - name: Commit Worker audit
        shell: bash
        run: |
          set -euo pipefail
          git add -A output/worker-audit.json output/worker-audit.csv output/worker-audit-gaps.csv output/status.json
          if git diff --cached --quiet; then
            echo "No Worker audit changes"
          else
            git commit -m "Audit Worker delivery"
            for attempt in 1 2 3 4; do
              echo "Worker audit publish attempt ${attempt}"
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Failed to publish Worker audit after 4 race-safe attempts"
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi
